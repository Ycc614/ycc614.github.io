<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工作台首页</title>
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
</head>
<body>
    <!--左侧侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="logo">🛡️ <span>园区后台</span></div>
        <div class="menu-parent" data-href="index.html">🏠 <span>工作台</span></div>
        <div class="menu-parent" data-have-sub="true">🏢 <span>园区管理</span></div>
        <div class="menu-parent" data-have-sub="true">🚗 <span>行车管理</span></div>
        <div class="sub-menu">
            <div class="menu-child" data-href="#">📍 <span>区域管理</span></div>
            <div class="menu-child" data-href="monthCard.html">💳 <span>月卡管理</span></div>
            <div class="menu-child" data-href="#">💰 <span>停车缴费管理</span></div>
            <div class="menu-child" data-href="#">📋 <span>计费规则管理</span></div>
        </div>
        <div class="menu-parent" data-have-sub="true">🏘️ <span>物业管理</span></div>
        <div class="sub-menu">
            <div class="menu-child" data-href="#">⚙️ <span>一体杆管理</span></div>
        </div>
        <div class="menu-parent" data-have-sub="true">🛠️ <span>系统管理</span></div>
    </div>

    <div class="right-wrap">
        <div class="header">
            <button id="foldAllBtn">☰</button>
            <span>工作台首页</span>
            <div class="header-right">👤 黑马管理员</div>
        </div>
        <div class="content">
            <!--4项统计卡片区域-->
            <div class="stat-container">
                <div class="stat-card">
                    <div class="icon-box icon-blue">💰</div>
                    <div class="label">年度累计收费（元）</div>
                    <div class="num" id="totalFee">0</div>
                </div>
                <div class="stat-card">
                    <div class="icon-box icon-green">🏢</div>
                    <div class="label">入驻企业总数（个）</div>
                    <div class="num" id="companyCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="icon-box icon-orange">🚗</div>
                    <div class="label">月卡车辆总数（辆）</div>
                    <div class="num" id="carCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="icon-box icon-purple">🚧</div>
                    <div class="label">一体杆总数（台）</div>
                    <div class="num" id="poleCount">0</div>
                </div>
            </div>

            <!--快捷入口模块 -->
            <div class="quick-box">
                <h4>快捷入口</h4>
                <button class="quick-btn" id="goMonthCard">月卡管理</button>
                <button class="quick-btn">添加企业</button>
                <button class="quick-btn">员工管理</button>
                <button class="quick-btn">数据报表</button>
            </div>

            <!--快捷入口模块 -->
            <div class="quick-box">
                <h4>快捷入口</h4>
                <p>功能待开发</p>
            </div>
        </div>
    </div>

<script>
//全局存储key，全部页面统一
const STORAGE_KEY = "monthCardData";
//静态模拟固定数据
const staticInfo = {
    totalFee: 56888,
    companyCount: 18,
    poleCount: 48
};

//千分位格式化金额
function formatMoney(num){
    return Number(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

//读取本地存储数据
function getLocalData(){
    let str = localStorage.getItem(STORAGE_KEY);
    if(str){
        return JSON.parse(str);
    }
}

//封装渲染函数 renderHomeStat
function renderHomeStat(){
    const list = getLocalData();
    document.getElementById("totalFee").innerText = formatMoney(staticInfo.totalFee);
    document.getElementById("companyCount").innerText = staticInfo.companyCount;
    document.getElementById("carCount").innerText = list ? list.length : 0;
    document.getElementById("poleCount").innerText = staticInfo.poleCount;
}

//快捷入口跳转
document.getElementById("goMonthCard").onclick = function(){
    location.href = "monthCard.html";
}

window.onload = function(){
    initCommonMenu();
    renderHomeStat();
}
</script>
</body>
</html>
